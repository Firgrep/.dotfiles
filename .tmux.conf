# Initial setup
set -g default-terminal xterm-256color

# Set the base-index to 1 rather than 0
set -g base-index 1
set-window-option -g pane-base-index 1

# Renumber windows when removing a window
set -g renumber-windows on

# Mouse Mode
set -g mouse on

# Easy config reload
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# C-f is the only prefix. C-j used to be a second prefix, but it is now handed
# to pane navigation (see "Seamless pane navigation" below).
set-option -g prefix C-f
set-option -g prefix2 None
unbind-key C-f
bind-key C-f send-prefix

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Seamless pane navigation with C-hjkl (smart-splits.nvim integration).
#
# `@pane-is-vim` is a pane-local option that smart-splits.nvim sets when it
# loads and unsets when Neovim exits or suspends. When the pane is running
# Neovim the key is forwarded so Neovim moves between its own splits; otherwise
# tmux moves between panes. One key set crosses both, and the boundary between
# a Neovim split and a tmux pane stops mattering.
#
# Requires smart-splits.nvim to load eagerly; see
# ~/.dotfiles/.config/nvim/lua/plugins/smart-splits.lua.
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

# C-hjkl is taken above, so clearing the screen moves behind the prefix.
bind-key C-l send-keys 'C-l'

# Same navigation from copy mode, where the bindings above do not apply.
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# Resize panes with M-hjkl, forwarded to Neovim the same way. Neovim keeps its
# own M-j/M-k (move line up/down); the resize only applies to non-Neovim panes.
bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

# Set easier window split keys (inherit current pane's working directory)
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

# Also make the default % and " splits inherit the current pane's path
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# And new windows inherit too (optional but usually what you want)
bind-key c new-window -c "#{pane_current_path}"

# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Easily reorder windows with CTRL+SHIFT+Arrow
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Allow the arrow key to be used immediately after changing windows.
set-option -g repeat-time 0

# No delay for escape key press
set -sg escape-time 0

# Increase scrollback buffer size (number of lines)
set -g history-limit 15000

# Colors, focus etc. required for neovim
set-option -g default-terminal "tmux-256color"
set-option -g focus-events on
set-option -as terminal-features '*:RGB'

# Theme
set-window-option -g window-status-current-style bold,bg=blue,fg=colour234
set-window-option -g window-status-style fg=colour0
set -g window-status-activity-style bold,bg=colour141,fg=white
set-option -g message-style bg=colour125,fg=colour231
set-option -g pane-border-style fg=colour8
set-option -g pane-active-border-style fg=colour35
set-option -g status-style fg=black,bg=color46

# Change background color of a tab when activity occurs
setw -g monitor-activity off

# Do NOT reset the color of the tab after activity stops occurring
setw -g monitor-silence 0

# Disable bell
setw -g monitor-bell off

# Disable visual text box when activity occurs
set -g visual-activity off

# Window
bind-key N previous-window

# Plugins
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection_mouse 'clipboard'

# Tmux Plugin Manager (must be last!)
# Remember to install TPM first: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
run '~/.tmux/plugins/tpm/tpm'

set-hook -g session-created 'run-shell "/home/filip/.local/bin/workmux sidebar"'
